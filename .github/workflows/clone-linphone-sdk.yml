name: Clone linphone-sdk (with submodules)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/clone-linphone-sdk.yml

jobs:
  clone-test:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner location
        run: |
          curl -s https://ipinfo.io/json

      - name: Diagnose connectivity to gitlab.linphone.org
        run: |
          curl -v --max-time 30 https://gitlab.linphone.org/ || true

      - name: Clone linphone-sdk
        run: |
          git clone https://gitlab.linphone.org/BC/public/linphone-sdk.git

      - name: Initialize submodules (with retry)
        working-directory: linphone-sdk
        run: |
          for attempt in $(seq 1 10); do
            echo "Attempt $attempt: git submodule update --init --recursive"
            if timeout 60 git submodule update --init --recursive; then
              echo "Submodules initialized successfully."
              exit 0
            fi
            echo "Attempt $attempt did not complete within 60s, retrying..."
            sleep 5
          done
          echo "::error::Failed to initialize submodules after multiple attempts"
          exit 1

      - name: Verify all submodules were fetched
        if: always()
        working-directory: linphone-sdk
        run: |
          echo "Top-level repository:"
          git log -1 --oneline
          echo
          echo "Submodule status (recursive):"
          git submodule status --recursive | tee /tmp/submodule-status.txt

          echo
          if grep -q '^[-+]' /tmp/submodule-status.txt; then
            echo "::error::One or more submodules were not initialized or are out of sync"
            grep '^[-+]' /tmp/submodule-status.txt
            exit 1
          fi

          echo "All submodules fetched successfully."
